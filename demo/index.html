<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <meta name="author" content="Tomasz Furdal" />
  <meta name="theme-color" content="#0f172a" />
  <title>Home Assistant demo | Tomasz Furdal</title>
  <meta name="description" content="Language selector for the Home Assistant live demo by Tomasz Furdal." />
  <link rel="canonical" href="https://ha-expert.com/en/demo/" />
  <link rel="alternate" hreflang="pl" href="https://ha-expert.com/pl/demo/" />
  <link rel="alternate" hreflang="en" href="https://ha-expert.com/en/demo/" />
  <link rel="alternate" hreflang="da" href="https://ha-expert.com/dk/demo/" />
  <link rel="alternate" hreflang="x-default" href="https://ha-expert.com/en/demo/" />
  <script>
    (function() {
      function normalizeLang(lang) {
        lang = (lang || "").toLowerCase();
        if (lang.indexOf("pl") === 0) return "pl";
        if (lang.indexOf("dk") === 0 || lang.indexOf("da") === 0) return "dk";
        if (lang.indexOf("en") === 0) return "en";
        return "";
      }

      function targetFor(lang) {
        if (lang === "pl") return "/pl/demo/";
        if (lang === "dk") return "/dk/demo/";
        if (lang === "en") return "/en/demo/";
        return "";
      }

      var params = new URLSearchParams(window.location.search);
      var requested = normalizeLang(params.get("lang"));
      var target = targetFor(requested);

      if (!target) {
        var browserLangs = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language || navigator.userLanguage || ""];

        for (var i = 0; i < browserLangs.length; i += 1) {
          target = targetFor(normalizeLang(browserLangs[i]));
          if (target) break;
        }
      }

      window.location.replace((target || "/en/demo/") + window.location.hash);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Home Assistant demo</h1>
    <p>Choose your language:</p>
    <ul>
      <li><a href="/pl/demo/">Polski</a></li>
      <li><a href="/en/demo/">English</a></li>
      <li><a href="/dk/demo/">Dansk</a></li>
    </ul>
  </main>
</body>
</html>
